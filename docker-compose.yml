version: '3.8'

services:
  wkpool:
    build: .
    container_name: wk-pool-2026
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - wkpool_data:/app/data
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_PATH=/app/data/wkpool.db
      # JWT_SECRET wordt NIET hier vastgelegd. Zet hem in een .env-bestand naast
      # deze compose-file (JWT_SECRET=...). Compose stopt met een duidelijke
      # foutmelding als hij ontbreekt, zodat je nooit per ongeluk zonder geheim draait.
      - JWT_SECRET=${JWT_SECRET:?Zet JWT_SECRET (een lang, willekeurig geheim) in een .env-bestand}
      - JWT_EXPIRES_IN=30d
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  wkpool_data:
    driver: local
