<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Subtle football field line pattern on transparent background -->
  <!-- Horizontal pitch stripes -->
  <rect x="0" y="0" width="400" height="60" fill="rgba(255,255,255,0.015)"/>
  <rect x="0" y="120" width="400" height="60" fill="rgba(255,255,255,0.015)"/>
  <rect x="0" y="240" width="400" height="60" fill="rgba(255,255,255,0.015)"/>
  <rect x="0" y="360" width="400" height="40" fill="rgba(255,255,255,0.015)"/>
  <!-- Outer boundary lines -->
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <!-- Centre line -->
  <line x1="20" y1="200" x2="380" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <!-- Centre circle -->
  <circle cx="200" cy="200" r="50" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <!-- Centre spot -->
  <circle cx="200" cy="200" r="3" fill="rgba(255,255,255,0.06)"/>
  <!-- Left penalty area -->
  <rect x="20" y="120" width="80" height="160" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <!-- Left goal area -->
  <rect x="20" y="160" width="32" height="80" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <!-- Left penalty spot -->
  <circle cx="72" cy="200" r="2.5" fill="rgba(255,255,255,0.05)"/>
  <!-- Left penalty arc -->
  <path d="M 100 170 A 40 40 0 0 1 100 230" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <!-- Right penalty area -->
  <rect x="300" y="120" width="80" height="160" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <!-- Right goal area -->
  <rect x="348" y="160" width="32" height="80" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <!-- Right penalty spot -->
  <circle cx="328" cy="200" r="2.5" fill="rgba(255,255,255,0.05)"/>
  <!-- Right penalty arc -->
  <path d="M 300 170 A 40 40 0 0 0 300 230" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <!-- Corner arcs -->
  <path d="M 20 36 A 16 16 0 0 1 36 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <path d="M 364 20 A 16 16 0 0 1 380 36" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <path d="M 380 364 A 16 16 0 0 1 364 380" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <path d="M 36 380 A 16 16 0 0 1 20 364" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
</svg>
